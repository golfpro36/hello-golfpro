<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello GolfPro</title>
  <!-- 1) บอกเบราว์เซอร์ว่าเว็บนี้ "ติดตั้งได้" -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d6b47">
  <!-- 2) ไอคอนสำหรับ iPhone -->
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    body { font-family: sans-serif; margin: 0; padding: 32px 20px; background: #f4f7f4; color: #142019; text-align: center; }
    h1 { color: #1d6b47; }
    .box { background: #fff; border-radius: 14px; padding: 20px; max-width: 420px; margin: 20px auto; }
  </style>
</head>
<body>
  <img src="icon-192.png" width="96" height="96" alt="" style="border-radius:20px">
  <h1>สวัสดี GolfPro</h1>
  <div class="box">
    <p>ถ้าเห็นหน้านี้แบบเต็มจอ ไม่มีแถบที่อยู่เว็บด้านบน<br>แปลว่าเปิดจาก<b>ไอคอนที่ติดตั้งแล้ว</b> 🎉</p>
    <p id="mode"></p>
  </div>
  <script>
    // แสดงว่าเปิดแบบเว็บธรรมดา หรือแบบแอปที่ติดตั้งแล้ว
    var installed = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    document.getElementById('mode').textContent = installed ? '✅ โหมดแอป (ติดตั้งแล้ว)' : '🌐 โหมดเว็บ (ยังไม่ได้ติดตั้ง)';
    // 3) ลงทะเบียน service worker (ทำให้ Android เสนอปุ่ม "ติดตั้งแอป")
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
